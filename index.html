    window.addEventListener('flutter-first-frame', function () {

    window.setTimeout(function () {
      var splash = document.getElementById('startup');
      if (!splash) return;
      document.getElementById('loading-text').textContent =
        'The app is taking longer than expected. Please retry or check your connection.';
      document.getElementById('restart').style.display = 'block';
    }, 15000);
  </script>
  <script>
    // Crop only the blank paper around the ORIGINAL green Mushaf panel.
    // Source JPEGs are never changed, and printed Arabic is not reflowed.
    // The native image includes white margins of very different sizes.
    window.riyadPrepareQuranPage = function (img) {
      if (img.hasAttribute('data-riyad-cropped') || !img.naturalWidth) return;
      try {
        const w = img.naturalWidth, h = img.naturalHeight;
        const source = document.createElement('canvas');
        source.width = w; source.height = h;
        const cx = source.getContext('2d', {willReadFrequently:true});
        cx.drawImage(img, 0, 0);
        const pixels = cx.getImageData(0,0,w,h).data;
        let minX=w, minY=h, maxX=-1, maxY=-1, hits=0;
        for (let y=0; y<h; y+=3) for(let x=0; x<w; x+=3) {
          const k=(y*w+x)*4, r=pixels[k],g=pixels[k+1],b=pixels[k+2];
          // The Mushaf's light mint border, unlike white paper and ink.
          if(g>r+13 && g>b+13 && g>140 && r>90 && b>90) {
            minX=Math.min(minX,x);maxX=Math.max(maxX,x);
            minY=Math.min(minY,y);maxY=Math.max(maxY,y);hits++;
          }
        }
        if(hits<80 || maxX-minX<w*0.20 || maxY-minY<h*0.16) return;
        const panelW=maxX-minX, panelH=maxY-minY;
        // The original PDF prints Surah/Juz headings ABOVE the mint frame,
        // and the page number BELOW it. Preserve both original paper strips
        // instead of painting a second, inaccurate Flutter header/footer.
        const px=Math.max(5,Math.round(panelW*0.025));
        const topPad=Math.max(10,Math.round(panelH*0.085));
        const bottomPad=Math.max(8,Math.round(panelH*0.070));
        const x0=Math.max(0,minX-px), y0=Math.max(0,minY-topPad);
        const cw=Math.min(w-x0,panelW+2*px+3);
        const ch=Math.min(h-y0,panelH+topPad+bottomPad+3);
        const cropped=document.createElement('canvas');
        cropped.width=cw;cropped.height=ch;
        cropped.getContext('2d').drawImage(source,x0,y0,cw,ch,0,0,cw,ch);
        img.setAttribute('data-riyad-cropped','1');
        img.src=cropped.toDataURL('image/jpeg',0.94);
      } catch(e) {
        console.warn('Mushaf page crop unavailable; showing original',e);
      }
    };
  </script>
  <script>
    // Counter target reached: audible chime on phones, computers and smart
    // boards with speakers. Playback starts only after a real counter tap.
    window.riyadTargetSound = function () {
      try {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        var ctx = window._riyadCounterAudioContext;
        if (!ctx || ctx.state === 'closed') {
          ctx = new AudioContextClass();
          window._riyadCounterAudioContext = ctx;
        }
        if (ctx.state === 'suspended') ctx.resume();
        var now = ctx.currentTime + 0.015;
        var notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach(function (frequency, index) {
          var start = now + index * 0.18;
          var oscillator = ctx.createOscillator();
          var volume = ctx.createGain();
          oscillator.type = 'triangle';
          oscillator.frequency.setValueAtTime(frequency, start);
          volume.gain.setValueAtTime(0.001, start);
          volume.gain.linearRampToValueAtTime(0.27, start + 0.025);
          volume.gain.exponentialRampToValueAtTime(0.001, start + 0.27);
          oscillator.connect(volume);
          volume.connect(ctx.destination);
          oscillator.start(start);
          oscillator.stop(start + 0.28);
        });
      } catch (error) {
        console.warn('Target sound unavailable on this device', error);
      }
    };
  </script>
  <script>
    // Release d1c53f0: use the published hashed build and refresh only
    // this app's catalog. Do not clear user preferences or other sites.
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const scope = new URL('/riyadul-adkar/', location.origin).href;
          const registrations = await navigator.serviceWorker.getRegistrations();
          const ours = registrations.filter(reg => reg.scope === scope);
          if (ours.length) await Promise.all(ours.map(reg => reg.unregister()));
          // An unregistered worker can still control an existing page.
          // One new navigation releases that old controller.
          if (ours.length && navigator.serviceWorker.controller) {
            const next = new URL(location.href);
            if (!next.searchParams.has('worker-reset')) {
              next.searchParams.set('worker-reset', '1');
              location.replace(next.href);
              return;
            }
          }
        }
      } catch (error) { console.warn('Service worker cleanup:', error); }

      const catalogUrl = new URL('assets/assets/data/library.json', document.baseURI);
      // Flutter uses fetch for bundled assets. Only the mutable catalog
      // must bypass the browser's old HTTP cache; leave all books alone.
      const originalFetch = window.fetch.bind(window);
      window.fetch = function(input, init) {
        try {
          const requested = new URL(typeof input === 'string' ? input :
            input instanceof URL ? input.href : input.url, document.baseURI);
          if (requested.origin === catalogUrl.origin &&
              requested.pathname === catalogUrl.pathname) {
            return originalFetch(input, Object.assign({}, init, {cache:'reload'}));
          }
        } catch (_) {}
        return originalFetch(input, init);
      };
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap-RIYAD20261123-UX1.js';
      script.async = true;
      script.onerror = function() {
        document.getElementById('loading-text').textContent =
          'Unable to download the current release. Please check your connection.';
        document.getElementById('restart').style.display = 'block';
      };
      document.body.appendChild(script);
    })();
  </script>

  <script>
  (function(){
    var btn=document.getElementById('jamia-links-open'), menu=document.getElementById('jamia-links-menu');
    function show(value){ menu.hidden=!value; btn.setAttribute('aria-expanded',String(value)); }
    btn.addEventListener('click',function(){show(menu.hidden)});
    document.addEventListener('pointerdown',function(ev){if(!document.getElementById('jamia-links').contains(ev.target))show(false)});
    document.addEventListener('keydown',function(ev){if(ev.key==='Escape')show(false)});
